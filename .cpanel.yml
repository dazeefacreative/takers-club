---
# cPanel account: takebloz — repo cloned to /home/takebloz/takersclub-api
# (API subdomain: api.takersclub.store)
deployment:
  tasks:
    # Backend: use the CloudLinux NodeJS Selector wrapper as intended — it
    # symlinks this app's node_modules into its registered venv correctly.
    - export NODEBIN=$(ls -d /home/takebloz/nodevenv/takersclub-api/backend/*/bin | head -n 1)
    - cd /home/takebloz/takersclub-api/backend && $NODEBIN/npm install --production

    # Frontend: there's no registered Node.js App for it, so the wrapper's
    # npm would (wrongly) resolve the *backend's* package.json/node_modules
    # via CL_APP_ROOT instead of the frontend's. Call the real npm binary
    # directly, bypassing the wrapper, so it operates on the frontend's own
    # package.json in the current directory like a normal npm install.
    - export REALNPM=/opt/alt/alt-nodejs20/root/usr/bin/npm
    # Put Node 20 itself on PATH too: packages with install scripts (e.g.
    # @tailwindcss/oxide runs "node ./scripts/install.js") call plain "node",
    # which otherwise fails with "node: command not found".
    - export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH
    # node_modules is kept between deploys (it's gitignored), so after the
    # first deploy npm only installs what changed — keeps updates to a few
    # minutes instead of a full reinstall every time.
    - cd /home/takebloz/takersclub-api/frontend && PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH VITE_API_URL=https://api.takersclub.store/api $REALNPM install --no-audit --no-fund
    - cd /home/takebloz/takersclub-api/frontend && PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH VITE_API_URL=https://api.takersclub.store/api $REALNPM run build
    # trailing "/." (not "/*") so dotfiles like .htaccess get copied too —
    # bash globs don't match dotfiles by default.
    - /bin/cp -r /home/takebloz/takersclub-api/frontend/dist/. /home/takebloz/public_html/

    - /bin/mkdir -p /home/takebloz/takersclub-api/backend/tmp
    - /bin/touch /home/takebloz/takersclub-api/backend/tmp/restart.txt
